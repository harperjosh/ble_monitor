[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ble-monitor"
version = "0.1.0"
description = "Make the invisible BLE radio chatter around you visible and understandable"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ble-monitor contributors" }]
keywords = ["bluetooth", "ble", "sniffer", "rf", "visualization", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "rich>=13.0",
  "pyserial>=3.5",
  "bleak>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
blemon = "blemon.cli.main:main"
ble-monitor = "blemon.cli.main:main"

[project.urls]
Homepage = "https://github.com/harperjosh/ble_monitor"
Documentation = "https://github.com/harperjosh/ble_monitor#readme"

[tool.hatch.build.targets.wheel]
# The built dashboard lives at src/blemon/web and is picked up by this glob,
# which is what lets `pip install ble-monitor` ship the UI with no Node.js.
packages = ["src/blemon"]
artifacts = ["src/blemon/web/**"]

[tool.hatch.build.targets.sdist]
include = ["src/blemon", "tests", "README.md", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
